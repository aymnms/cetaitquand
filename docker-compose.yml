services:
  backend:
    build:
      context: ./server
    container_name: cetaitquand-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://cetaitquand:${DB_PASSWORD}@db:5432/cetaitquand
      - FRONTEND_URL=https://cetaitquand.fr
      - FRONTEND_URL_2=${FRONTEND_URL_2:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cetaitquand-api.rule=Host(`api.cetaitquand.fr`)"
      - "traefik.http.routers.cetaitquand-api.entrypoints=websecure"
      - "traefik.http.routers.cetaitquand-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.cetaitquand-api.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    container_name: cetaitquand-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cetaitquand
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=cetaitquand
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cetaitquand -d cetaitquand"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    labels:
      - "traefik.enable=false"

networks:
  proxy:
    external: true
  internal:

volumes:
  db_data:
